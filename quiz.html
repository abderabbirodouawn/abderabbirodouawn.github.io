<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Grand Quizz One Piece – Niveau Légendaire</title>
  <meta name="description" content="Réponds aux 20 questions... seules les légendes du Nouveau Monde peuvent obtenir 20/20 !">
  <style>
    :root{--bg:#0f172a;--panel:#0b1222;--ring:#1f2937;--accent:#60a5fa;--accent2:#a78bfa;--text:#e5e7eb;--muted:#9ca3b8}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);line-height:1.6}
    .wrap{max-width:900px;margin:0 auto;padding:24px}
    .header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
    h1{margin:0;font-size:clamp(22px,5vw,32px);background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shimmer 6s linear infinite}
    @keyframes shimmer{0%{background-position:0 0}100%{background-position:200% 0}}
    a{color:#93c5fd;text-decoration:none} a:hover{text-decoration:underline}
    .card{background:var(--panel);border:1px solid var(--ring);border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(0,0,0,.25)}
    .muted{color:var(--muted)}
    .qnum{font-size:13px;color:var(--muted);margin-bottom:6px}
    .q{font-weight:700;margin:8px 0 12px}
    .input{display:flex;gap:8px;flex-wrap:wrap}
    input[type=text]{flex:1;min-width:240px;background:#0f172a;border:1px solid #334155;border-radius:12px;color:var(--text);padding:10px}
    button{border:1px solid var(--accent);background:transparent;color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer}
    button:hover{background:#0f172a}
    .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
    .good{color:#10b981}
    .bad{color:#f87171}
    .score{margin-top:18px;padding:12px;border:1px dashed #334155;border-radius:12px}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .chip{font-size:12px;padding:4px 8px;border:1px solid #334155;border-radius:999px;background:#0f172a}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>Grand Quiz One Piece – Niveau Légendaire</h1>
      <a href="./">← Retour au portfolio</a>
    </div>
    <p class="muted">Bienvenue dans mon quiz ultime sur One Piece ! Teste tes connaissances sur l’univers de Luffy et de ses compagnons. Bonne chance, futur Roi des Pirates ! ⚔️🏴‍☠️ </p>

    <div class="card">
      <div class="qnum" id="qnum"></div>
      <div class="q" id="question"></div>

      <div class="input">
        <input id="answer" type="text" placeholder="Ta réponse..." autocomplete="off"/>
        <button id="valider">Valider</button>
      </div>

      <div id="result" style="margin-top:10px"></div>

      <div class="actions">
        <button id="suivant" disabled>Question suivante</button>
        <button id="rejouer" style="display:none">Rejouer</button>
      </div>

      <div id="score" class="score" style="display:none"></div>

      <div id="hints" class="chips" aria-hidden="true"></div>
    </div>
  </div>

  <script>
  // ===== Données du quiz (collées de ton JSON) =====
  const QUIZ = {
    "titre": "Grand Quiz One Piece - Niveau Légendaire",
    "description": "Réponds aux 20 questions... seules les légendes du Nouveau Monde peuvent obtenir 20/20 !",
    "questions": [
      {"numero":1,"question":"Quel est le nom du fruit du démon de Luffy, selon sa véritable nature révélée à Wano ?","bonnes_reponses":["hito hito no mi","nika"],"correction":"C'était le Hito Hito no Mi, modèle Nika (Dieu du Soleil)."},
      {"numero":2,"question":"Qui est le seul pirate connu à posséder deux fruits du démon ?","bonnes_reponses":["barbe noire","marshall d. teach"],"correction":"C'était Marshall D. Teach (Barbe Noire)."},
      {"numero":3,"question":"Quel ancien vice-amiral est le père de Luffy ?","bonnes_reponses":["dragon","monkey d. dragon"],"correction":"C'était Monkey D. Dragon, chef de l'Armée Révolutionnaire."},
      {"numero":4,"question":"Comment s'appelle la mer où Luffy a grandi ?","bonnes_reponses":["east blue"],"correction":"C'était East Blue."},
      {"numero":5,"question":"Qui est la mère adoptive de Luffy ?","bonnes_reponses":["curly dadan","dadan"],"correction":"C'était Curly Dadan."},
      {"numero":6,"question":"Quel est le vrai nom du Roi des Pirates ?","bonnes_reponses":["gol d. roger","gold roger","Gol D roger"],"correction":"C'était Gol D. Roger."},
      {"numero":7,"question":"Quel personnage a construit le navire Oro Jackson ?","bonnes_reponses":["tom"],"correction":"C'était Tom, le charpentier de Water Seven."},
      {"numero":8,"question":"Quelle est l'arme antique cachée à Alabasta ?","bonnes_reponses":["pluton"],"correction":"C'était Pluton."},
      {"numero":9,"question":"Quelle est la capacité du fruit Yami Yami no Mi ?","bonnes_reponses":["ténèbres","tenebres","absorber"],"correction":"C'est le pouvoir des ténèbres, capable d'absorber toute chose."},
      {"numero":10,"question":"Quel est le seul ancien amiral à avoir combattu Barbe Blanche en duel ? (1 réponse possible, 2 choix.)","bonnes_reponses":["sengoku","garp"],"correction":"C'était Garp et Sengoku ensemble à Marineford."},
      {"numero":11,"question":"Quelle île a été détruite par un Buster Call en raison de ses recherches sur les Ponéglyphes ?","bonnes_reponses":["ohara"],"correction":"C'était Ohara, l'île natale de Nico Robin."},
      {"numero":12,"question":"Quelle est la prime OU donne le nom de la plus élevée connue dans tout One Piece ?","bonnes_reponses":["gol d. roger","5","5564800000"],"correction":"Gol D. Roger : 5 564 800 000 berrys."},
      {"numero":13,"question":"Qui est le père biologique de Yamato ?","bonnes_reponses":["kaido"],"correction":"C'était Kaido des Cent Bêtes."},
      {"numero":14,"question":"Quelle est la capacité du fruit Gura Gura no Mi ?","bonnes_reponses":["tremblement","séisme","ondes de choc"],"correction":"Il permet de provoquer des tremblements de terre."},
      {"numero":15,"question":"Qui a tué Portgas D. Ace ?","bonnes_reponses":["akainu","sakazuki"],"correction":"C'était Akainu (Sakazuki)."},
      {"numero":16,"question":"Quel est le seul membre des Cinq Doyens à avoir révélé son nom complet ?","bonnes_reponses":["saint jaygarcia saturn","saturn"],"correction":"C'était Saint Jaygarcia Saturn."},
      {"numero":17,"question":"Quelle est la capacité spéciale du fruit de Brook ?","bonnes_reponses":["revivre","âme","yomi yomi"],"correction":"C'était le Yomi Yomi no Mi, qui permet de revivre après la mort."},
      {"numero":18,"question":"Qui a tué Kozuki Oden ?","bonnes_reponses":["kaido"],"correction":"C'était Kaido, avec l'aide d'Orochi."},
      {"numero":19,"question":"Quelle est la véritable identité de Joy Boy ?","bonnes_reponses":["inconnue","mystère","luffy"],"correction":"Encore un mystère, mais lié à Luffy/Nika."},
      {"numero":20,"question":"Quelle est la signification du D. dans les noms ?","bonnes_reponses":["ennemis des dieux","mystère","volonté du d"],"correction":"C'est lié à la Volonté du D. — les ennemis des dieux."}
    ]
  };

  // ===== Utils : normalisation (sans accents, casse, espaces multiples) =====
  const norm = s => (s||"")
    .toString()
    .trim()
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')        // enlève accents
    .replace(/[’']/g,"'")                                   // apostrophes uniformes
    .replace(/\s+/g,' ')                                    // espaces multiples -> 1
    .replace(/[^a-z0-9 .,'-]/g,'')                          // garde simple (évite emojis)
    .trim();

  // quelques alias automatiques usuels
  const canon = s => {
    s = norm(s);
    // gold/gol
    if (s === "gold roger") s = "gol d. roger";
    if (s === "gol d roger" || s === "gol d roger") s = "gol d. roger";
    if (s === "marshall d teach") s = "marshall d. teach";
    if (s === "curly dadan") s = "dadan"; // on accepte aussi "dadan"
    if (s === "tenebres") s = "ténèbres"; // permet compatibilité réponses fournies
    if (s === "yomi yomi no mi") s = "yomi yomi";
    if (s === "volonte du d") s = "volonté du d";
    return s;
  };

  // ===== Éléments =====
  let i = 0, score = 0, locked = false;
  const qnum = document.getElementById('qnum');
  const q = document.getElementById('question');
  const input = document.getElementById('answer');
  const res = document.getElementById('result');
  const scoreBox = document.getElementById('score');
  const hints = document.getElementById('hints');
  const btnValider = document.getElementById('valider');
  const btnSuivant = document.getElementById('suivant');
  const btnRejouer = document.getElementById('rejouer');

  function renderQuestion(){
    const item = QUIZ.questions[i];
    locked = false;
    res.innerHTML = "";
    scoreBox.style.display = "none";
    btnSuivant.disabled = true;
    btnSuivant.textContent = "Question suivante";
    input.value = "";
    input.focus();
    qnum.textContent = `Question ${i+1} / ${QUIZ.questions.length}`;
    q.textContent = item.question;

    // petites "hints" (optionnel) : montres le nombre d'acceptations
    hints.innerHTML = "";
    const nb = item.bonnes_reponses.length;
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = `Réponses acceptées: ${nb}`;
    hints.appendChild(chip);
  }

  function isCorrect(user, answers){
    const u = canon(user);
    // accepte aussi si le user donne juste un nombre clé (ex: "5564800000" ou "5")
    for (const a of answers){
      if (canon(a) === u) return true;
    }
    return false;
  }

  function validate(){
    if (locked) return;
    const val = input.value;
    if (!val.trim()){
      res.innerHTML = '<span class="bad">Entre une réponse 😉</span>';
      return;
    }
    locked = true;

    const item = QUIZ.questions[i];
    const ok = isCorrect(val, item.bonnes_reponses);

    if (ok){
      score++;
      res.innerHTML = '<span class="good">✅ Correct !</span>';
    } else {
      // affiche première bonne réponse en "canon", + correction texte
      const goodDisplay = item.bonnes_reponses[0];
      res.innerHTML = `<span class="bad">❌ Faux.</span> Bonne réponse acceptée : <strong>${goodDisplay}</strong><br><span class="muted">${item.correction||""}</span>`;
    }

    // dernière ?
    btnSuivant.disabled = false;
    if (i === QUIZ.questions.length - 1){
      btnSuivant.textContent = "Voir le score";
    }
  }

  function next(){
    if (i < QUIZ.questions.length - 1){
      i++; renderQuestion();
    } else {
      showScore();
    }
  }

  function showScore(){
    qnum.textContent = "Quiz terminé 🎉";
    q.textContent = QUIZ.titre;
    res.innerHTML = `<span class="muted">${QUIZ.description}</span>`;
    scoreBox.style.display = "block";
    const pct = Math.round((score / QUIZ.questions.length) * 100);
    scoreBox.innerHTML = `<strong>Score :</strong> ${score} / ${QUIZ.questions.length} (${pct}%)<br>
      ${pct>=90 ? "Roi des Pirates 👑" : pct>=70 ? "Supernova 💫" : pct>=50 ? "Capitaine en devenir ⚓" : "Mousse du Sunny — encore un effort 🏴‍☠️"}`;
    btnValider.style.display = "none";
    btnSuivant.style.display = "none";
    btnRejouer.style.display = "inline-block";
  }

  function resetQuiz(){
    i = 0; score = 0; locked = false;
    btnValider.style.display = "inline-block";
    btnSuivant.style.display = "inline-block";
    btnSuivant.disabled = true;
    btnRejouer.style.display = "none";
    renderQuestion();
  }

  // events
  btnValider.addEventListener('click', validate);
  btnSuivant.addEventListener('click', next);
  btnRejouer.addEventListener('click', resetQuiz);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') validate(); });

  // start
  renderQuestion();
  </script>
</body>
</html>
