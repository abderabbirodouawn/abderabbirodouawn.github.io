<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Grand Quizz One Piece – Niveau Légendaire</title>
  <meta name="description" content="Réponds aux 20 questions... seules les légendes du Nouveau Monde peuvent obtenir 20/20 !">
  <style>
    :root{--bg:#0f172a;--panel:#0b1222;--ring:#1f2937;--accent:#60a5fa;--accent2:#a78bfa;--text:#e5e7eb;--muted:#9ca3b8}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);line-height:1.6}
    .wrap{max-width:900px;margin:0 auto;padding:24px}
    .header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
    h1{margin:0;font-size:clamp(22px,5vw,32px);background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shimmer 6s linear infinite}
    @keyframes shimmer{0%{background-position:0 0}100%{background-position:200% 0}}
    a{color:#93c5fd;text-decoration:none} a:hover{text-decoration:underline}
    .card{background:var(--panel);border:1px solid var(--ring);border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(0,0,0,.25)}
    .muted{color:var(--muted)}
    .qnum{font-size:13px;color:var(--muted);margin-bottom:6px}
    .q{font-weight:700;margin:8px 0 12px}
    .input{display:flex;gap:8px;flex-wrap:wrap}
    input[type=text]{flex:1;min-width:240px;background:#0f172a;border:1px solid #334155;border-radius:12px;color:var(--text);padding:10px}
    button{border:1px solid var(--accent);background:transparent;color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer}
    button:hover{background:#0f172a}
    .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
    .good{color:#10b981}
    .bad{color:#f87171}
    .score{margin-top:18px;padding:12px;border:1px dashed #334155;border-radius:12px}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .chip{font-size:12px;padding:4px 8px;border:1px solid #334155;border-radius:999px;background:#0f172a}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>Grand Quiz One Piece – Niveau Légendaire</h1>
      <a href="./">← Retour au portfolio</a>
    </div>
    <p class="muted">Bienvenue dans mon quiz ultime sur One Piece ! Teste tes connaissances sur l’univers de Luffy et de ses compagnons. Bonne chance, futur Roi des Pirates ! ⚔️🏴‍☠️ </p>

    <div class="card">
      <div class="qnum" id="qnum"></div>
      <div class="q" id="question"></div>

      <div class="input">
        <input id="answer" type="text" placeholder="Ta réponse..." autocomplete="off"/>
        <button id="valider">Valider</button>
      </div>

      <div id="result" style="margin-top:10px"></div>

      <div class="actions">
        <button id="suivant" disabled>Question suivante</button>
        <button id="rejouer" style="display:none">Rejouer</button>
      </div>

      <div id="score" class="score" style="display:none"></div>

      <div id="hints" class="chips" aria-hidden="true"></div>
    </div>
  </div>

  <script>
  // ===== Données du quiz (2 faciles, 18 difficiles, arcs tous différents) =====
  const QUIZ = {
    "titre": "Grand Quiz One Piece - Niveau Légendaire",
    "description": "2 questions faciles pour s'échauffer, puis 18 difficiles — une par arc !",
    "questions": [
      // ————— FACILES —————
      {"numero":1,"question":"(Syrup Village) Comment s'appelle le premier navire des Chapeaux de paille ?","bonnes_reponses":["going merry","merry"],"correction":"Le Going Merry, offert par Kaya lors de l'arc Syrup Village."},
      {"numero":2,"question":"(Alabasta) Quel est le prénom de la princesse d'Alabasta ?","bonnes_reponses":["vivi","nefertari vivi","nefretari vivi"],"correction":"Nefertari Vivi, princesse d'Alabasta."},

      // ————— DIFFICILES —————
      {"numero":3,"question":"(Loguetown) Quel marchand d'épées vend à Zoro Yubashiri et Sandai Kitetsu ?","bonnes_reponses":["ipponmatsu"],"correction":"Ipponmatsu, le vendeur de Loguetown."},
      {"numero":4,"question":"(Whiskey Peak) Combien de chasseurs de primes Zoro met-il K.O. à Whiskey Peak ?","bonnes_reponses":["100","cent"],"correction":"Zoro terrasse une centaine (≈100) de chasseurs de primes."},
      {"numero":5,"question":"(Little Garden) Cite l'un des deux géants d'Elbaf présents sur l'île.","bonnes_reponses":["dorry","brogy"],"correction":"Dorry et Brogy, les deux guerriers d'Elbaf."},
      {"numero":6,"question":"(Drum) Quel médecin a inspiré Chopper ?","bonnes_reponses":["hiriluk","dr hiriluk","docteur hiriluk"],"correction":"Le Dr Hiriluk, mentor de Chopper."},
      {"numero":7,"question":"(Jaya) Comment s'appelle le descendant de Mont Blanc Noland vivant à Jaya ?","bonnes_reponses":["mont blanc cricket","cricket"],"correction":"Mont Blanc Cricket, chasseur de trésors à Mock Town."},
      {"numero":8,"question":"(Skypiea) Comment s'appelle la cloche géante de Shandora ?","bonnes_reponses":["cloche d'or","golden bell","cloche dor"],"correction":"La cloche d'or de Shandora (Golden Bell)."},
      {"numero":9,"question":"(Long Ring Long Land) Quel est le nom du rayon de Foxy qui ralentit ses adversaires ?","bonnes_reponses":["noro noro","noro noro beam","noro beam"],"correction":"Le Noro Noro Beam de Foxy."},
      {"numero":10,"question":"(Water 7) Comment s'appelle la compagnie de charpentiers dirigée par Iceburg ?","bonnes_reponses":["galley-la","galley la","galley-la company","galley la company"],"correction":"La Galley-La Company."},
      {"numero":11,"question":"(Enies Lobby) Quel ‘juge’ à trois têtes préside le tribunal ?","bonnes_reponses":["baskerville"],"correction":"Baskerville (en réalité trois personnes)."},
      {"numero":12,"question":"(Thriller Bark) Quel est le nom du géant zombie n°900 ?","bonnes_reponses":["oars","oz","ors"],"correction":"Oars (parfois orthographié Oz)."},
      {"numero":13,"question":"(Archipel Sabaody) Qui recouvre le Thousand Sunny pour aller sous l'eau ?","bonnes_reponses":["silvers rayleigh","rayleigh"],"correction":"Silvers Rayleigh réalise le coating."},
      {"numero":14,"question":"(Amazon Lily) Comment s'appelle le serpent géant trône de Boa Hancock ?","bonnes_reponses":["salome","salomé"],"correction":"Salome, le serpent géant de Hancock."},
      {"numero":15,"question":"(Impel Down) À quel niveau est emprisonné Jinbe lorsque Luffy l'y rencontre ?","bonnes_reponses":["6","niveau 6","level 6"],"correction":"Au niveau 6, le niveau des criminels légendaires."},
      {"numero":16,"question":"(Retour à Sabaody) Quel est le nom du faux ‘Luffy’ qui dirige les Faux Chapeaux de paille ?","bonnes_reponses":["demaro black","demaro"],"correction":"Demaro Black se fait passer pour Luffy."},
      {"numero":17,"question":"(Île des Hommes-Poissons) Comment s'appellent les pilules dopantes utilisées par les Nouveaux Hommes-Poissons ?","bonnes_reponses":["es","energy steroid","steroides energetiques","stéroïdes énergétiques","steroides"],"correction":"Les Energy Steroid, abrégées ES."},
      {"numero":18,"question":"(Punk Hazard) Quel est le nom du gaz mortel libéré par César Clown ?","bonnes_reponses":["shinokuni"],"correction":"Shinokuni, l'‘Empire de la Mort’."},
      {"numero":19,"question":"(Dressrosa) Quel est le vrai nom du soldat jouet ?","bonnes_reponses":["kyros"],"correction":"Kyros, ancien gladiateur légendaire."},
      {"numero":20,"question":"(Zou) Quel est le nom du ‘Roi du Jour’ des Minks ?","bonnes_reponses":["inuarashi","duke dogstorm","dogstorm"],"correction":"Inuarashi (Duke Dogstorm), le Roi du Jour."}
    ]
  };

  // ===== Utils : normalisation (sans accents, casse, espaces multiples) =====
  const norm = s => (s||"")
    .toString()
    .trim()
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')        // enlève accents
    .replace(/[’']/g,"'")                                   // apostrophes uniformes
    .replace(/\s+/g,' ')                                    // espaces multiples -> 1
    .replace(/[^a-z0-9 .,'-]/g,'')                          // garde simple (évite emojis)
    .trim();

  // quelques alias automatiques usuels
  const canon = s => {
    s = norm(s);
    if (s === "gold roger") s = "gol d. roger";
    if (s === "gol d roger" || s === "gol d roger") s = "gol d. roger";
    if (s === "marshall d teach") s = "marshall d. teach";
    if (s === "curly dadan") s = "dadan";
    if (s === "tenebres") s = "ténèbres";
    if (s === "yomi yomi no mi") s = "yomi yomi";
    if (s === "volonte du d") s = "volonté du d";
    return s;
  };

  // ===== Éléments =====
  let i = 0, score = 0, locked = false;
  const qnum = document.getElementById('qnum');
  const q = document.getElementById('question');
  const input = document.getElementById('answer');
  const res = document.getElementById('result');
  const scoreBox = document.getElementById('score');
  const hints = document.getElementById('hints');
  const btnValider = document.getElementById('valider');
  const btnSuivant = document.getElementById('suivant');
  const btnRejouer = document.getElementById('rejouer');

  function renderQuestion(){
    const item = QUIZ.questions[i];
    locked = false;
    res.innerHTML = "";
    scoreBox.style.display = "none";
    btnSuivant.disabled = true;
    btnSuivant.textContent = "Question suivante";
    input.value = "";
    input.focus();
    qnum.textContent = `Question ${i+1} / ${QUIZ.questions.length}`;
    q.textContent = item.question;

    // petites "hints" : montre le nombre d'acceptations
    hints.innerHTML = "";
    const nb = item.bonnes_reponses.length;
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = `Réponses acceptées: ${nb}`;
    hints.appendChild(chip);
  }

  function isCorrect(user, answers){
    const u = canon(user);
    for (const a of answers){
      if (canon(a) === u) return true;
    }
    return false;
  }

  function validate(){
    if (locked) return;
    const val = input.value;
    if (!val.trim()){
      res.innerHTML = '<span class="bad">Entre une réponse 😉</span>';
      return;
    }
    locked = true;

    const item = QUIZ.questions[i];
    const ok = isCorrect(val, item.bonnes_reponses);

    if (ok){
      score++;
      res.innerHTML = '<span class="good">✅ Correct !</span>';
    } else {
      const goodDisplay = item.bonnes_reponses[0];
      res.innerHTML = `<span class="bad">❌ Faux.</span> Bonne réponse acceptée : <strong>${goodDisplay}</strong><br><span class="muted">${item.correction||""}</span>`;
    }

    btnSuivant.disabled = false;
    if (i === QUIZ.questions.length - 1){
      btnSuivant.textContent = "Voir le score";
    }
  }

  function next(){
    if (i < QUIZ.questions.length - 1){
      i++; renderQuestion();
    } else {
      showScore();
    }
  }

  function showScore(){
    qnum.textContent = "Quiz terminé 🎉";
    q.textContent = QUIZ.titre;
    res.innerHTML = `<span class=\"muted\">${QUIZ.description}</span>`;
    scoreBox.style.display = "block";
    const pct = Math.round((score / QUIZ.questions.length) * 100);
    scoreBox.innerHTML = `<strong>Score :</strong> ${score} / ${QUIZ.questions.length} (${pct}%)<br>
      ${pct>=90 ? "Roi des Pirates 👑" : pct>=70 ? "Supernova 💫" : pct>=50 ? "Capitaine en devenir ⚓" : "Mousse du Sunny — encore un effort 🏴‍☠️"}`;
    btnValider.style.display = "none";
    btnSuivant.style.display = "none";
    btnRejouer.style.display = "inline-block";
  }

  function resetQuiz(){
    i = 0; score = 0; locked = false;
    btnValider.style.display = "inline-block";
    btnSuivant.style.display = "inline-block";
    btnSuivant.disabled = true;
    btnRejouer.style.display = "none";
    renderQuestion();
  }

  btnValider.addEventListener('click', validate);
  btnSuivant.addEventListener('click', next);
  btnRejouer.addEventListener('click', resetQuiz);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') validate(); });

  renderQuestion();
  </script>
</body>
</html>
