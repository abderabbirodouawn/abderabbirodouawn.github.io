 <style>
    :root{
      /* 🌙 Thème nuit (par défaut) */
      --bg: #0b0f19;
      --layer: #0e1525;
      --card: #111826;
      --muted: #94a3b8;
      --text: #e2e8f0;
      --brand: #7c3aed;
      --brand-2: #22d3ee;
      --accent: #10b981;
      --border: rgba(148,163,184,.15);
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --hover: rgba(124,58,237,.12);
    }
    :root.light{
      /* ☀️ Thème jour */
      --bg: #f6f8fc;
      --layer: #ffffff;
      --card: #ffffff;
      --muted: #475569;
      --text: #0f172a;
      --brand: #6366f1;
      --brand-2: #06b6d4;
      --accent: #059669;
      --border: rgba(2,6,23,.08);
      --shadow: 0 10px 26px rgba(2,6,23,.08);
      --hover: rgba(99,102,241,.08);
    }
/* Initiales A.R animées */
.monogram{
  font-size:24px;
  font-style:italic;
  font-weight:900;
  background: linear-gradient(135deg,var(--brand),var(--brand-2),#8b5cf6);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: gradient-shift 3s ease-in-out infinite;
  text-shadow: 0 0 20px rgba(124,58,237,.3);
  position:relative;
  padding:8px 12px;
  border-radius:8px;
  transition:transform .3s ease;
}
.monogram:hover{
  transform: scale(1.1) rotate(-2deg);
  filter: drop-shadow(0 4px 12px rgba(124,58,237,.4));
}
.monogram::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:8px;
  padding:2px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity:.5;
  animation: border-glow 2s ease-in-out infinite;
}
@keyframes gradient-shift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
@keyframes border-glow{
  0%,100%{opacity:.3}
  50%{opacity:.8}
}
    *{box-sizing:border-box; transition: background-color .25s, color .25s, border-color .25s}
    html{scroll-behavior:smooth}
    html,body{height:100%; margin:0; font-family:Inter,system-ui,sans-serif; color:var(--text); background:linear-gradient(180deg,var(--layer),var(--bg)); overflow-x:hidden;}
    a{color:inherit;text-decoration:none}

    /* Canvas fond techno */
    #tech-bg{position:fixed; inset:0; z-index:0; pointer-events:none}

    .container{max-width:1100px;margin:0 auto;padding:24px;position:relative;z-index:1}
    header{position:sticky;top:0;z-index:50;backdrop-filter:saturate(160%) blur(10px);background:linear-gradient(to bottom,rgba(8,12,20,.85),rgba(8,12,20,.55));border-bottom:1px solid var(--border);}
    :root.light header{background:linear-gradient(to bottom,rgba(255,255,255,.9),rgba(255,255,255,.8));}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
    .logo{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 180deg,var(--brand),var(--brand-2));box-shadow:var(--shadow)}
    .links{display:flex;gap:4px;flex-wrap:wrap}
    .links a{opacity:.9;font-weight:600;padding:10px 14px;border-radius:12px;display:inline-block;transition:transform .18s}
    .links a:hover{background:var(--hover);transform:scale(1.04)}
    .switch{border:1px solid var(--border);background:var(--card);padding:8px 12px;border-radius:999px;font-weight:700;transition:transform .18s;cursor:pointer}
    .switch:hover{transform:scale(1.05)}

    /* Badge disponible */
    .badge-dispo{
      position:fixed;
      top:80px;
      right:20px;
      z-index:100;
      background:linear-gradient(135deg,var(--accent),#34d399);
      color:white;
      padding:10px 16px;
      border-radius:999px;
      font-weight:700;
      font-size:14px;
      box-shadow:0 8px 20px rgba(16,185,129,.3);
      animation:pulse-badge 2s ease-in-out infinite;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .badge-dispo::before{
      content:"";
      width:8px;
      height:8px;
      background:#fff;
      border-radius:50%;
      animation:blink 1.5s ease-in-out infinite;
    }
    @keyframes pulse-badge{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.05)}
    }
    @keyframes blink{
      0%,100%{opacity:1}
      50%{opacity:.4}
    }
    @media(max-width:900px){.badge-dispo{top:60px;right:10px;font-size:12px;padding:8px 12px}}

    section{padding:42px 0}
    .chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(124,58,237,.10);border:1px solid var(--border);border-radius:999px;font-weight:700;font-size:14px}
    .hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding:48px 0 24px}
    @media(max-width:900px){.hero{grid-template-columns:1fr;text-align:center}}
    .title{font-size:clamp(36px,5vw,64px);line-height:1.05;margin:8px 0 16px}
    .subtitle{font-size:clamp(16px,2.2vw,18px);color:var(--muted);line-height:1.6}
    .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
    @media(max-width:900px){.cta{justify-content:center}}
    .btn{display:inline-flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);box-shadow:var(--shadow);transition:transform .18s;font-size:15px}
    .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));border:none;color:white}
    .btn.secondary{background:linear-gradient(135deg,var(--accent),#34d399);border:none;color:white}
    .btn:hover{transform:scale(1.04)}
    .btn svg{width:18px;height:18px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow);transition:transform .18s}
    .card:hover{transform:translateY(-2px) scale(1.02)}
    .muted{color:var(--muted)}.small{font-size:14px}
    .grid{display:grid;gap:18px}.grid.cols-2{grid-template-columns:repeat(2,1fr)}.grid.cols-3{grid-template-columns:repeat(3,1fr)}
    @media(max-width:900px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr}}
    h2{font-size:clamp(22px,2.6vw,30px);margin:0 0 18px}
    h3{font-size:clamp(18px,2vw,22px);margin:0 0 10px}
    footer{text-align:center;color:var(--muted);padding:40px 0 60px;font-size:14px}

    /* Tags */
    .tags{display:flex;flex-wrap:wrap;gap:10px}
    .tag{padding:8px 12px;border-radius:999px;background:rgba(148,163,184,.12);border:1px solid var(--border);font-weight:600;display:inline-block;transition:transform .18s;font-size:13px}
    .tag:hover{transform:scale(1.05)}

    /* ✨ Nom + titre en gradient animé */
    .fancy-name{
      display:inline-block;
      background: linear-gradient(90deg,var(--brand),#8b5cf6,#22d3ee,#38bdf8,var(--brand));
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sheen 6s ease-in-out infinite;
      text-shadow: 0 0 18px rgba(124,58,237,.25), 0 0 8px rgba(34,211,238,.15);
      position: relative;
      white-space: normal;
      padding-bottom: 2px;
      transition: transform .2s, filter .2s, text-shadow .2s;
    }
    .fancy-name::after{
      content:"";
      position:absolute; left:0; right:0; bottom:-6px; height:2px;
      background: linear-gradient(90deg, transparent, var(--brand), var(--brand-2), transparent);
      opacity:.85; border-radius:999px;
    }
    .fancy-name:hover{
      transform: translateZ(0) scale(1.02);
      text-shadow: 0 0 22px rgba(124,58,237,.35), 0 0 14px rgba(34,211,238,.25);
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.15));
    }
    @media(prefers-reduced-motion:reduce){.fancy-name{animation:none}}
    @keyframes sheen{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }

    /* 👤 Photo de profil arrondie */
    .photo-wrapper{display:flex;align-items:center;justify-content:center}
    .profile-pic{
      width:280px;height:280px;object-fit:cover;border-radius:50%;
      border:3px solid var(--brand-2);
      box-shadow:0 0 25px rgba(34,211,238,.25),0 0 50px rgba(124,58,237,.15);
      transition:transform .3s ease, box-shadow .3s ease;
    }
    .profile-pic:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(34,211,238,.4),0 0 80px rgba(124,58,237,.25)}
    @media(max-width:900px){.photo-wrapper{margin-top:24px}.profile-pic{width:200px;height:200px}}

    /* Section À propos */
    .about-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start}
    @media(max-width:900px){.about-grid{grid-template-columns:1fr}}
    .about-text{line-height:1.7}
    .stats{display:flex;flex-direction:column;gap:12px}
    .stat-item{background:rgba(124,58,237,.08);padding:14px;border-radius:12px;border:1px solid var(--border)}
    .stat-value{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .stat-label{font-size:13px;color:var(--muted);margin-top:4px}

    /* Timeline formations */
    .timeline{position:relative;padding-left:30px}
    .timeline::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--brand),var(--brand-2))}
    .timeline-item{position:relative;margin-bottom:24px}
    .timeline-item::before{content:"";position:absolute;left:-26px;top:4px;width:12px;height:12px;background:var(--brand);border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 3px var(--border)}
    .timeline-date{font-size:13px;color:var(--brand);font-weight:700;margin-bottom:4px}
    .timeline-title{font-weight:700;margin-bottom:4px}

    /* Projets avec liens GitHub */
    .project-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px;gap:12px}
    .project-links{display:flex;gap:8px}
    .icon-btn{padding:6px 10px;background:rgba(124,58,237,.1);border:1px solid var(--border);border-radius:8px;transition:all .18s;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
    .icon-btn:hover{background:rgba(124,58,237,.2);transform:scale(1.05)}
    .icon-btn svg{width:16px;height:16px}

    /* Certifications */
    .cert-badge{background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(34,211,238,.15));padding:12px 16px;border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;gap:12px;transition:transform .18s}
    .cert-badge:hover{transform:scale(1.02)}
    .cert-icon{width:40px;height:40px;background:var(--brand);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:18px}
    .cert-info{flex:1}
    .cert-name{font-weight:700;margin-bottom:2px}
    .cert-org{font-size:13px;color:var(--muted)}
  </style>
